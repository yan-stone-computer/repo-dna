[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-dna"
version = "0.1.0"
description = "One command, zero dependencies: a full personality scan of any git repository — terminal report plus a shareable SVG card."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "repo-dna contributors" }]
keywords = ["git", "analytics", "cli", "developer-tools", "bus-factor", "readme", "terminal", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/repo-dna"
Issues = "https://github.com/YOUR_USERNAME/repo-dna/issues"

[project.scripts]
repo-dna = "repo_dna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
